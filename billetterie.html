<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Ingénieur – Nour & Safae</title>
  <meta name="description" content="Portfolio de Nour Erraji, élève ingénieure : compétences, projets et contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Formulaire -->
    <section id="contact" class="section">
      <div class="container">
        <h2 class="section-title">Contact</h2>
        <div class="contact-grid">
          <div class="contact-info">
            <p>Une opportunité de stage, une question, un projet ? Écrivez-moi.</p>
            <ul>
              <li>✉ <a href="mailto:nour.erraji@email.com">nour.erraji@email.com</a></li>
              <li>in <a href="https://www.linkedin.com/in/nour-erraji" target="_blank" rel="noopener">LinkedIn</a></li>
              <li>⌥ <a href="https://github.com/nourerraji" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
          </div>
          <form id="contactForm" class="form" novalidate>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
            <small class="error" data-for="nom"></small>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>
            <small class="error" data-for="email"></small>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
            <small class="error" data-for="message"></small>

            <button type="submit" class="btn btn-primary">Envoyer</button>
            <p id="formStatus" class="form-status" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
