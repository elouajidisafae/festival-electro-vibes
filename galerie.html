<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie - Electro Vibes</title>
  <style>
    .grille {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .grille div {
      background: #333;
      color: #fff;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Galerie</h1>

  <div class="grille">
    <div>Photo 1</div>
    <div>Photo 2</div>
    <div>Photo 3</div>
    <div>Photo 4</div>
    <div>Photo 5</div>
    <div>Photo 6</div>
  </div>
</body>
</html>
